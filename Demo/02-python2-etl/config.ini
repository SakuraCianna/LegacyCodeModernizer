[DEFAULT]
environment = production
log_level = DEBUG
batch_size = 50
max_workers = 4
retry_attempts = 3
retry_backoff_sec = 2.0

[market_api]
base_url = https://api.legacy-fintech.internal/v1/quotes
api_key = SEC-FIN-KEY-9988771122
timeout_sec = 10
rate_limit_per_sec = 15

[risk_thresholds]
max_leverage_ratio = 5.0
volatility_warning_limit = 0.35
var_confidence_level = 0.95
default_base_currency = USD

[storage]
data_directory = /var/data/finance/legacy_cache
backup_pickle_path = ./data/risk_state.pkl
audit_log_path = ./data/audit_execution.log
